name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.24", stable]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        # Windows checkouts turn line endings into CRLF, which gofmt reports.
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - name: Test
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Cross-compile
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null .
          GOOS=linux GOARCH=arm64 go build -o /dev/null .
      - name: Check shell scripts
        run: sh -n install.sh && sh -n scripts/build-release.sh

  oldest-git:
    # The README promises git 2.30 or newer, so the tests also run against
    # git 2.30.0 itself, built from the official source release.
    name: test (git 2.30.0)
    runs-on: ubuntu-latest
    env:
      GIT_VERSION: 2.30.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Restore git ${{ env.GIT_VERSION }}
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/git-${{ env.GIT_VERSION }}
          key: git-${{ env.GIT_VERSION }}-${{ runner.os }}
      - name: Build git ${{ env.GIT_VERSION }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://mirrors.edge.kernel.org/pub/software/scm/git/git-$GIT_VERSION.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/git-$GIT_VERSION" -j"$(nproc)" prefix="$HOME/git-$GIT_VERSION" \
            NO_CURL=1 NO_EXPAT=1 NO_TCLTK=1 NO_GETTEXT=1 NO_PERL=1 NO_PYTHON=1 install
      - name: Use git ${{ env.GIT_VERSION }}
        run: echo "$HOME/git-$GIT_VERSION/bin" >> "$GITHUB_PATH"
      - name: Show the git version
        run: git --version
      - name: Test
        run: go test ./...
