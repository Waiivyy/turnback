name: Release

on:
  push:
    tags: ["v*"]

# Nothing by default. Only the publish job may write, and it runs no code
# from the repository.
permissions: {}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # to sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build archives
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Write the Homebrew cask
        run: |
          mkdir homebrew
          scripts/homebrew-cask.sh "$GITHUB_REF_NAME" dist/checksums.txt >homebrew/turnback.rb
      # Anyone can check that an archive was built here, from this tag, with
      # gh attestation verify <archive> --repo Waiivyy/turnback.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            homebrew/
            release-notes.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "turnback $GITHUB_REF_NAME" \
            --notes-file release-notes.md

  homebrew:
    # Pushes the cask the build job wrote to Waiivyy/homebrew-tap, with a
    # token that can write to that repository only. Like publish, it runs no
    # code from this repository.
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Update the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, so Waiivyy/homebrew-tap was not updated."
            exit 0
          fi
          gh auth setup-git
          git clone --depth 1 https://github.com/Waiivyy/homebrew-tap.git tap
          mkdir -p tap/Casks
          cp homebrew/turnback.rb tap/Casks/turnback.rb
          cd tap
          git add Casks/turnback.rb
          if git diff --cached --quiet; then
            echo "The cask is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "turnback ${GITHUB_REF_NAME#v}"
          git push -q origin HEAD
