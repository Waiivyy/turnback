<text xml:space="preserve" x="22" y="115"><tspan fill="#e6edf3"> </tspan><tspan fill="#e3b341">2</tspan><tspan fill="#e6edf3">  today 15:41      1  </tspan><tspan fill="#3fb950">+5</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#f85149">-9</tspan><tspan fill="#e6edf3">    cursor  Switch the limiter to a sliding window</tspan></text>
