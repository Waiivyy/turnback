<text xml:space="preserve" x="22" y="514"><tspan fill="#e6edf3"> </tspan></text>
<text xml:space="preserve" x="22" y="533"><tspan fill="#e6edf3"> export function rateLimit(req: Request, res: Response, next: NextFunction) {</tspan></text>
<text xml:space="preserve" x="22" y="552"><tspan fill="#8b949e">…</tspan></text>
<text xml:space="preserve" x="22" y="590"><tspan fill="#e6edf3">Apply this undo? [y/N] </tspan><tspan fill="#e6edf3" font-weight="700">y</tspan></text>
